name: umrati
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.7
  country_code_picker: ^3.3.0
  dlibphonenumber: ^1.1.38
  easy_localization: ^3.0.7+1
  firebase_auth: ^5.5.3
  firebase_core: ^3.13.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.1.0
  fluttertoast: ^8.2.12
  geocoding: ^3.0.0
  geolocator: ^14.0.0
  google_maps_flutter: ^2.12.2
  google_sign_in: ^6.3.0
  http4: ^0.0.4
  permission_handler: ^12.0.0+1
  pinput: ^5.0.1
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^7.0.1
  flutter_facebook_auth: ^7.1.2
  vibration: ^3.1.3
  flutter_sliding_up_panel: ^2.1.1
  flutter_tts: ^4.2.3
  flutter_pay_buttons:
    git:
      url: https://github.com/M-Tayyab-Mustafa/flutter_pay_buttons
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: 

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/svg/settings/
    - assets/svg/gender/
    - assets/svg/ziarat/
    - assets/svg/bottom_nav/
    - assets/png/
    - assets/png/home/
    - assets/png/flags/
    - assets/png/map/
    - assets/translations/
    
  fonts:
    - family: Jameel Noori Nastaleeq Kasheeda
      fonts:
        - asset: assets/font/urdu/jameel_noori_nastaleeq_kasheeda.ttf
      
    - family: KFGQPC Uthmanic Script HAFS Regular
      fonts:
        - asset: assets/font/arabic/kfgqpc_uthmanic_script_hafs_regular.ttf
      
    - family: Roboto
      fonts:
        - asset: assets/font/english/black.ttf
          weight: 900
        - asset: assets/font/english/extra_bold.ttf
          weight: 800
        - asset: assets/font/english/bold.ttf
          weight: 700
        - asset: assets/font/english/extra_light.ttf
          weight: 600
        - asset: assets/font/english/light.ttf
          weight: 500
        - asset: assets/font/english/medium.ttf
          weight: 400
        - asset: assets/font/english/regular.ttf
          weight: 300
        - asset: assets/font/english/semi_bold.ttf
          weight: 200
        - asset: assets/font/english/thin.ttf
          weight: 100
          